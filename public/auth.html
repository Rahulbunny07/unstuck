<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to Unstuck</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 17l5 5 9-12' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav">
    <div class="wrap nav-in">
      <a class="brand" href="/"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Unstuck</a>
      <div class="navauth" id="navAuth"></div>
    </div>
  </header>

  <main class="wrap narrow">
    <section class="card" aria-labelledby="authTitle">
      <div class="tabs" role="tablist" aria-label="Account">
        <button type="button" role="tab" id="tabIn" aria-selected="true" class="tab">Sign in</button>
        <button type="button" role="tab" id="tabUp" aria-selected="false" class="tab">Create account</button>
      </div>
      <h1 id="authTitle" class="authtitle">Welcome back</h1>
      <p class="hint" id="authSub">Sign in to use your own API keys and connect MCP servers.</p>

      <form id="authForm" novalidate>
        <div class="field" id="nameField" hidden>
          <label class="label" for="name">Name <span class="opt">optional</span></label>
          <input id="name" type="text" autocomplete="name" maxlength="60">
        </div>
        <div class="field">
          <label class="label" for="email">Email</label>
          <input id="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label class="label" for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" minlength="8" required>
          <p class="hint" id="pwHint" hidden>At least 8 characters.</p>
        </div>
        <button class="primary full" id="submit" type="submit">Sign in</button>
        <p class="form-error" id="err" role="alert" hidden></p>
      </form>
      <p class="hint small-top">You can use Unstuck without an account. An account lets you bring your own API key and connect tools.</p>
    </section>
  </main>

  <script src="nav.js"></script>
  <script src="auth.js"></script>
</body>
</html>
