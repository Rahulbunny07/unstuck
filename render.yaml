# Render blueprint: New > Blueprint > pick this repo. It asks for the two secrets marked sync: false.
#
# PAID PLAN WITH A DISK: our library, votes, accounts, credits and payment records live in one SQLite
# file, so it sits on a persistent disk mounted at /var/data. Render's free instances have no disk and
# wipe local files when they sleep or redeploy, which is not acceptable once customers pay.
# DB_PERSISTENT=1 below tells the app the database is on permanent storage, which unlocks live
# (rzp_live_) payments. Only keep it if the disk block stays here.
#
# Keep ONE instance: the database file, daily limits and throttle each live inside one process.
services:
  - type: web
    name: unstuck
    runtime: node
    plan: starter
    branch: master
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: unstuck-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/unstuck.db
      - key: DB_PERSISTENT
        value: "1"
      - key: ENCRYPTION_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_URL
        value: https://unstuck-ns43.onrender.com
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: MATCH_THRESHOLD
        value: "0.85"
      - key: DAILY_AI_LIMIT_ANON
        value: "4"
      - key: DAILY_AI_LIMIT_USER
        value: "10"
      - key: DAILY_AI_LIMIT_IP
        value: "150"
      - key: GLOBAL_DAILY_AI_CALLS
        value: "150"
      - key: GLOBAL_DAILY_AI_TOKENS
        value: "180000"
      - key: THROTTLE_TOKENS_PER_MIN
        value: "6500"
      - key: THROTTLE_MAX_WAIT_SECONDS
        value: "30"
