# Render blueprint: New > Blueprint > pick this repo. It asks for the two secrets marked sync: false.
#
# FREE PLAN for now: data resets when the service sleeps or redeploys.
# For permanent storage later: plan starter, a disk at /var/data, DB_PATH=/var/data/unstuck.db, DB_PERSISTENT=1.
services:
  - type: web
    name: unstuck
    runtime: node
    plan: free
    branch: master
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ENCRYPTION_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: PUBLIC_URL
        value: https://unstuck-ns43.onrender.com
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: MATCH_THRESHOLD
        value: "0.85"
      - key: DAILY_AI_LIMIT_ANON
        value: "4"
      - key: DAILY_AI_LIMIT_USER
        value: "10"
      - key: DAILY_AI_LIMIT_IP
        value: "150"
      - key: GLOBAL_DAILY_AI_CALLS
        value: "150"
      - key: GLOBAL_DAILY_AI_TOKENS
        value: "180000"
      - key: THROTTLE_TOKENS_PER_MIN
        value: "6500"
      - key: THROTTLE_MAX_WAIT_SECONDS
        value: "30"
