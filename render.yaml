# Render blueprint: New > Blueprint > pick this repo. It asks for the two secrets marked sync: false.
#
# FREE PLAN, NO DISK: Render's free instances have no persistent disk and wipe local files when they
# sleep (after 15 minutes without visitors) or redeploy. Our library, votes and accounts live in one
# SQLite file, so on this plan they RESET. Fine for trying the app, not for counting real users.
# For real use: set plan to starter and add the disk block below, mounted at /var/data, with
# DB_PATH=/var/data/unstuck.db.
#
#   disk:
#     name: unstuck-data
#     mountPath: /var/data
#     sizeGB: 1
#
# Keep ONE instance: the database file, daily limits and throttle each live inside one process.
services:
  - type: web
    name: unstuck
    runtime: node
    plan: free
    branch: master
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /tmp/unstuck.db
      - key: ENCRYPTION_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_URL
        value: https://unstuck-ns43.onrender.com
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: MATCH_THRESHOLD
        value: "0.85"
      - key: DAILY_AI_LIMIT_ANON
        value: "4"
      - key: DAILY_AI_LIMIT_USER
        value: "10"
      - key: DAILY_AI_LIMIT_IP
        value: "150"
      - key: GLOBAL_DAILY_AI_CALLS
        value: "150"
      - key: GLOBAL_DAILY_AI_TOKENS
        value: "180000"
      - key: THROTTLE_TOKENS_PER_MIN
        value: "6500"
      - key: THROTTLE_MAX_WAIT_SECONDS
        value: "30"
