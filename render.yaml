# Render blueprint: New > Blueprint > pick this repo. It asks for the two secrets marked sync: false.
#
# PAID PLAN WITH A DISK: our library, votes, accounts, credits, claims, team records and the live user
# count all live in one SQLite file, so it sits on a persistent disk mounted at /var/data and survives
# sleep and redeploys. (Render's free instances have no disk and wipe local files.)
# The service name stays "unstuck", so the public address does not change.
#
# Keep ONE instance: the database file, daily limits and throttle each live inside one process.
services:
  - type: web
    name: unstuck
    runtime: node
    plan: starter
    branch: master
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: unstuck-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/unstuck.db
      - key: DB_PERSISTENT
        value: "1"
      - key: ENCRYPTION_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: PUBLIC_URL
        value: https://unstuck-ns43.onrender.com
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: MATCH_THRESHOLD
        value: "0.85"
      - key: DAILY_AI_LIMIT_ANON
        value: "4"
      - key: DAILY_AI_LIMIT_USER
        value: "10"
      - key: DAILY_AI_LIMIT_IP
        value: "150"
      - key: GLOBAL_DAILY_AI_CALLS
        value: "150"
      - key: GLOBAL_DAILY_AI_TOKENS
        value: "180000"
      - key: THROTTLE_TOKENS_PER_MIN
        value: "6500"
      - key: THROTTLE_MAX_WAIT_SECONDS
        value: "30"
